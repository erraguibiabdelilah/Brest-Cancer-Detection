<div class="dashboard-container">
  <!-- Sidebar Navigation (Desktop) -->
  <div class="sidebar desktop-sidebar">
    <div class="sidebar-content">
      <div *ngFor="let item of navItems" 
           class="nav-item-wrapper"
           (mouseenter)="setHoveredItem(item.id)"
           (mouseleave)="setHoveredItem(null)">
        <button
          [routerLink]="item.route"
          routerLinkActive="active"
          [class.active]="isActiveRoute(item.id)"
          class="nav-button"
          [title]="item.label">
          <!--<span class="nav-icon">{{ item.icon }}</span>-->
          <img class="nav-icon" [src]="item.icon" alt="icon" width="25px " height="25px">
        </button>
        
        <!-- Tooltip -->
        <div *ngIf="hoveredItem === item.id && !isActiveRoute(item.id)" class="tooltip">
          {{ item.label }}
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" *ngIf="showMobileMenu" (click)="closeMobileMenu()"></div>

  <!-- Mobile Sidebar -->
  <div class="mobile-sidebar" [class.open]="showMobileMenu">
    <div class="mobile-sidebar-header">
      <div class="mobile-logo">
        <img src="logo2.png" alt="Logo" class="mobile-logo-img">
        <span class="mobile-logo-title">
          <span class="title-part1">Breast</span>
          <span class="title-part2">Care</span>
        </span>
      </div>
      <button class="mobile-close-btn" (click)="closeMobileMenu()">✕</button>
    </div>
    <div class="mobile-sidebar-content">
      <div *ngFor="let item of navItems" 
           class="mobile-nav-item"
           (click)="onNavItemClick(item.route)">
        <button
          [routerLink]="item.route"
          routerLinkActive="active"
          [class.active]="isActiveRoute(item.id)"
          class="mobile-nav-button">
          
          <img  class="mobile-nav-icon" [src]="item.icon" alt="icon" width="25" height="25">
          <span class="mobile-nav-label">{{ item.label }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
          <span class="hamburger-icon">☰</span>
        </button>
        <img src="logo2.png" alt="Logo" class="header-logo">
        <span class="header-title">
          <span class="title-part1">Breast</span>
          <span class="title-part2">Care</span>
        </span>
      </div>
      
      <div class="header-right">
        <div class="profile-dropdown-wrapper" (click)="$event.stopPropagation()">
          <button class="profile-button" (click)="toggleProfileDropdown()">
            <div class="profile-avatar-small">
              <span class="avatar-initials">{{ getInitials() }}</span>
            </div>
            <span class="profile-name">{{ currentUser?.name || currentUser?.email }}</span>
            <span class="dropdown-arrow" [class.open]="showProfileDropdown">▼</span>
          </button>
          
          <div class="profile-dropdown" *ngIf="showProfileDropdown">
            <div class="dropdown-header">
              <div class="dropdown-user-info">
                <div class="dropdown-avatar">
                  <span class="avatar-initials-large">{{ getInitials() }}</span>
                </div>
                <div class="dropdown-user-details">
                  <div class="dropdown-name">{{ currentUser?.name || 'Utilisateur' }}</div>
                  <div class="dropdown-email">{{ currentUser?.email }}</div>
                </div>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-item" (click)="logout()">
              <span class="dropdown-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
  <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
</svg></span>
              <span>Déconnexion</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
